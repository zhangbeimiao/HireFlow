services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hireflow
      POSTGRES_USER: hireflow
      POSTGRES_PASSWORD: hireflow_dev_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireflow -d hireflow"]
      interval: 5s
      timeout: 3s
      retries: 10
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: hireflow
      RABBITMQ_DEFAULT_PASS: hireflow_dev_only
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      HIREFLOW_MIGRATION_DATABASE_URL: postgresql+psycopg://hireflow:hireflow_dev_only@postgres:5432/hireflow
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    environment:
      # The web API is deliberately not the schema owner. RLS binds this account to the JWT tenant.
      HIREFLOW_DATABASE_URL: postgresql+asyncpg://hireflow_app:hireflow_app_dev_only@postgres:5432/hireflow
      HIREFLOW_JWT_SECRET: local-development-secret-change-before-production
      HIREFLOW_REDIS_URL: redis://redis:6379/0
      HIREFLOW_LIST_CACHE_TTL_SECONDS: 60
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  worker:
    build: .
    command: python -m hireflow.worker
    environment:
      HIREFLOW_DATABASE_URL: postgresql+asyncpg://hireflow:hireflow_dev_only@postgres:5432/hireflow
      HIREFLOW_RABBITMQ_URL: amqp://hireflow:hireflow_dev_only@rabbitmq/
      HIREFLOW_METRICS_PORT: 9101
    ports:
      - "9101:9101"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
  notification-consumer:
    build: .
    command: python -m hireflow.consumer
    environment:
      HIREFLOW_DATABASE_URL: postgresql+asyncpg://hireflow:hireflow_dev_only@postgres:5432/hireflow
      HIREFLOW_RABBITMQ_URL: amqp://hireflow:hireflow_dev_only@rabbitmq/
      HIREFLOW_METRICS_PORT: 9102
    ports:
      - "9102:9102"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
