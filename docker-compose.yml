services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hireflow
      POSTGRES_USER: hireflow
      POSTGRES_PASSWORD: ${HIREFLOW_POSTGRES_PASSWORD:?set HIREFLOW_POSTGRES_PASSWORD in .env}
    ports:
      - "${HIREFLOW_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireflow -d hireflow"]
      interval: 5s
      timeout: 3s
      retries: 10
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: hireflow
      RABBITMQ_DEFAULT_PASS: ${HIREFLOW_RABBITMQ_PASSWORD:?set HIREFLOW_RABBITMQ_PASSWORD in .env}
    ports:
      - "${HIREFLOW_BIND_ADDRESS:-127.0.0.1}:5672:5672"
      - "${HIREFLOW_BIND_ADDRESS:-127.0.0.1}:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "${HIREFLOW_BIND_ADDRESS:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      HIREFLOW_MIGRATION_DATABASE_URL: "postgresql+psycopg://hireflow:${HIREFLOW_POSTGRES_PASSWORD:?set HIREFLOW_POSTGRES_PASSWORD in .env}@postgres:5432/hireflow"
      HIREFLOW_APP_DATABASE_PASSWORD: ${HIREFLOW_APP_DATABASE_PASSWORD:?set HIREFLOW_APP_DATABASE_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    environment:
      # The web API is deliberately not the schema owner. RLS binds this account to the JWT tenant.
      HIREFLOW_DATABASE_URL: "postgresql+asyncpg://hireflow_app:${HIREFLOW_APP_DATABASE_PASSWORD:?set HIREFLOW_APP_DATABASE_PASSWORD in .env}@postgres:5432/hireflow"
      HIREFLOW_JWT_SECRET: ${HIREFLOW_JWT_SECRET:?set HIREFLOW_JWT_SECRET in .env}
      HIREFLOW_ALLOWED_HOSTS: ${HIREFLOW_ALLOWED_HOSTS:-localhost,127.0.0.1}
      HIREFLOW_REDIS_URL: redis://redis:6379/0
      HIREFLOW_LIST_CACHE_TTL_SECONDS: 60
    ports:
      - "${HIREFLOW_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  outbox-relay:
    build:
      context: ./services/outbox-relay-go
    environment:
      HIREFLOW_DATABASE_URL: "postgresql://hireflow:${HIREFLOW_POSTGRES_PASSWORD:?set HIREFLOW_POSTGRES_PASSWORD in .env}@postgres:5432/hireflow"
      HIREFLOW_RABBITMQ_URL: "amqp://hireflow:${HIREFLOW_RABBITMQ_PASSWORD:?set HIREFLOW_RABBITMQ_PASSWORD in .env}@rabbitmq/"
      HIREFLOW_HTTP_ADDRESS: :9101
      HIREFLOW_OUTBOX_BATCH_SIZE: 100
      HIREFLOW_OUTBOX_POLL_INTERVAL: 1s
      HIREFLOW_OUTBOX_LEASE_DURATION: 60s
      HIREFLOW_PUBLISH_TIMEOUT: 5s
    ports:
      - "${HIREFLOW_BIND_ADDRESS:-127.0.0.1}:9101:9101"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9101/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
  worker-python:
    profiles: ["python-relay"]
    build: .
    command: python -m hireflow.worker
    environment:
      HIREFLOW_DATABASE_URL: "postgresql+asyncpg://hireflow:${HIREFLOW_POSTGRES_PASSWORD:?set HIREFLOW_POSTGRES_PASSWORD in .env}@postgres:5432/hireflow"
      HIREFLOW_RABBITMQ_URL: "amqp://hireflow:${HIREFLOW_RABBITMQ_PASSWORD:?set HIREFLOW_RABBITMQ_PASSWORD in .env}@rabbitmq/"
      HIREFLOW_METRICS_PORT: 9103
    ports:
      - "${HIREFLOW_BIND_ADDRESS:-127.0.0.1}:9103:9103"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
  notification-consumer:
    build: .
    command: python -m hireflow.consumer
    restart: on-failure
    environment:
      HIREFLOW_DATABASE_URL: "postgresql+asyncpg://hireflow:${HIREFLOW_POSTGRES_PASSWORD:?set HIREFLOW_POSTGRES_PASSWORD in .env}@postgres:5432/hireflow"
      HIREFLOW_RABBITMQ_URL: "amqp://hireflow:${HIREFLOW_RABBITMQ_PASSWORD:?set HIREFLOW_RABBITMQ_PASSWORD in .env}@rabbitmq/"
      HIREFLOW_METRICS_PORT: 9102
    ports:
      - "${HIREFLOW_BIND_ADDRESS:-127.0.0.1}:9102:9102"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
