name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  HIREFLOW_POSTGRES_PASSWORD: hireflow_ci_only
  HIREFLOW_APP_DATABASE_PASSWORD: hireflow_app_ci_only
  HIREFLOW_RABBITMQ_PASSWORD: hireflow_ci_only
  HIREFLOW_JWT_SECRET: hireflow-ci-jwt-secret-with-at-least-32-bytes
  HIREFLOW_GRAFANA_ADMIN_PASSWORD: hireflow_grafana_ci_only
  HIREFLOW_BIND_ADDRESS: 127.0.0.1
  HIREFLOW_ALLOWED_HOSTS: localhost,127.0.0.1,testserver

jobs:
  quality:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests migrations load

      - name: Unit tests
        run: python -m pytest -q

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: services/outbox-relay-go/go.sum

      - name: Vet and test Go Outbox Relay
        working-directory: services/outbox-relay-go
        run: |
          go vet ./...
          go test -race ./...

  security:
    name: Dependency, secret, and image security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e . pip-audit
          python -m pip_audit --vulnerability-service osv

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: services/outbox-relay-go/go.sum

      - name: Audit Go dependencies and reachable code
        working-directory: services/outbox-relay-go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Scan Git history for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --exit-code 1

      - name: Scan source and dependency manifests
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.76.1 \
            fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /repo

      - name: Build application images for scanning
        run: |
          docker build -t hireflow-api:security .
          docker build -t hireflow-relay:security services/outbox-relay-go

      - name: Scan application images
        run: |
          for image in hireflow-api:security hireflow-relay:security; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.76.1 image --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 "$image"
          done

  integration:
    name: Docker integration checks
    runs-on: ubuntu-latest
    needs: [quality, security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up load-test runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Locust test dependency
        run: python -m pip install -e ".[dev]"

      - name: Validate observability configuration
        run: |
          python -m json.tool deploy/grafana/dashboards/hireflow-relay.json > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability config --quiet
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate development, test, production, and TLS Compose overlays
        env:
          HIREFLOW_JWT_KEYS: '{"ci-2026":"hireflow-ci-rotating-key-with-at-least-32-bytes"}'
          HIREFLOW_JWT_ACTIVE_KEY_ID: ci-2026
          HIREFLOW_SMTP_HOST: smtp.example.test
          HIREFLOW_SMTP_USERNAME: ci-user
          HIREFLOW_SMTP_PASSWORD: ci-password
          HIREFLOW_TLS_ROOT: /tmp/hireflow-tls
          HIREFLOW_API_DATABASE_TLS_URL: postgresql+asyncpg://hireflow_app:ci@postgres:5432/hireflow?ssl=require
          HIREFLOW_MIGRATION_DATABASE_TLS_URL: postgresql+psycopg://hireflow:ci@postgres:5432/hireflow?sslmode=require
          HIREFLOW_RELAY_DATABASE_TLS_URL: postgresql://hireflow:ci@postgres:5432/hireflow?sslmode=require
          HIREFLOW_OWNER_DATABASE_TLS_URL: postgresql+asyncpg://hireflow:ci@postgres:5432/hireflow?ssl=require
          HIREFLOW_RABBITMQ_TLS_URL: amqps://hireflow:ci@rabbitmq:5671/
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.tls.example.yml config --quiet

      - name: Start full application stack
        run: docker compose up --build -d --wait --wait-timeout 90

      - name: Set up Go integration runner
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: services/outbox-relay-go/go.sum

      - name: Verify Go Relay broker failures, leases, and concurrent claims
        working-directory: services/outbox-relay-go
        env:
          HIREFLOW_TEST_DATABASE_URL: postgresql://hireflow:hireflow_ci_only@localhost:5432/hireflow
          HIREFLOW_TEST_RABBITMQ_URL: amqp://hireflow:hireflow_ci_only@localhost:5672/
        run: |
          docker compose -f ../../docker-compose.yml stop outbox-relay
          trap 'docker compose -f ../../docker-compose.yml start outbox-relay' EXIT
          go test -race ./internal/broker ./internal/outbox

      - name: Verify Compose service readiness
        shell: pwsh
        run: ./scripts/stack_smoke.ps1

      - name: Verify Alembic upgrade and downgrade round-trip in an isolated database
        shell: pwsh
        run: ./scripts/migration_smoke.ps1

      - name: Verify application containers are non-root
        run: |
          for service in api notification-consumer email-dispatcher outbox-relay; do
            uid="$(docker compose exec -T "$service" id -u)"
            test "$uid" != "0" || { echo "$service runs as root"; exit 1; }
          done

      - name: Verify workbench workflow and database conflict authority
        shell: pwsh
        run: ./scripts/workbench_smoke.ps1

      - name: Verify complete applicant tracking workflow
        shell: pwsh
        run: ./scripts/ats_smoke.ps1

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify recruiting workbench end to end
        env:
          HIREFLOW_E2E_BASE_URL: http://127.0.0.1:8000
        run: python -m pytest -q -m e2e tests/e2e

      - name: Verify ATS public API contracts with pytest
        env:
          HIREFLOW_INTEGRATION_BASE_URL: http://127.0.0.1:8000
          HIREFLOW_MAILPIT_BASE_URL: http://127.0.0.1:8025
        run: python -m pytest -q -m integration tests/integration

      - name: Verify duplicate ATS notification delivery is idempotent
        shell: pwsh
        run: ./scripts/notification_idempotency_smoke.ps1

      - name: Verify SMTP outage retry and recovery
        shell: pwsh
        run: ./scripts/email_failure_smoke.ps1

      - name: Verify authentication, RBAC, and tenant isolation
        shell: pwsh
        run: ./scripts/security_smoke.ps1

      - name: Verify PostgreSQL Row-Level Security
        shell: pwsh
        run: ./scripts/rls_smoke.ps1

      - name: Verify concurrent scheduling conflict
        shell: pwsh
        run: ./scripts/concurrency_smoke.ps1

      - name: Verify dependency outages and end-to-end recovery
        shell: pwsh
        run: ./scripts/failure_drill.ps1

      - name: Load test the single-slot concurrency boundary
        shell: pwsh
        run: ./scripts/load_test.ps1 -Users 10 -SpawnRate 10 -RunSeconds 5

      - name: Verify Redis Cache Aside behavior
        shell: pwsh
        run: ./scripts/cache_smoke.ps1

      - name: Verify keyset pagination
        shell: pwsh
        run: ./scripts/pagination_smoke.ps1

      - name: Verify pagination indexes with EXPLAIN ANALYZE
        shell: pwsh
        run: ./scripts/explain_analyze.ps1

      - name: Compare PostgreSQL and warmed-cache list performance
        shell: pwsh
        run: ./scripts/cache_performance.ps1 -Users 10 -SpawnRate 10 -RunSeconds 5 -ItemsPerList 10

      - name: Verify Redis rate limiting and observability
        shell: pwsh
        run: |
          ./scripts/rate_limit_smoke.ps1
          ./scripts/observability_smoke.ps1

      - name: Print service logs after a failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop ephemeral services
        if: always()
        run: docker compose down -v
