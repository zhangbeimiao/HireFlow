global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: hireflow-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]
  - job_name: hireflow-outbox-relay
    static_configs:
      - targets: ["outbox-relay:9101"]
  - job_name: hireflow-notification-consumer
    static_configs:
      - targets: ["notification-consumer:9102"]
