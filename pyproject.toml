[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hireflow"
version = "0.1.0"
description = "Multi-tenant interview scheduling platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "aiosqlite>=0.20,<0.22",
  "pydantic>=2.8,<3.0",
  "email-validator>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "asyncpg>=0.29,<1.0",
  "psycopg[binary]>=3.1,<4.0",
  "aio-pika>=9.4,<10.0",
  "PyJWT>=2.8,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "redis>=5.0,<6.0",
  "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/hireflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# FastAPI's dependency declarations intentionally use these defaults.
ignore = ["B008"]
